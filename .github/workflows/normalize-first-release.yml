name: Normalize first public release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-first-release.yml']
permissions:
  contents: read
concurrency:
  group: normalize-first-release
  cancel-in-progress: false
jobs:
  normalize:
    if: github.repository == 'VividMuse-AGI/VMNodes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow
      - run: python install.py
      - run: python tools/check_release.py --public
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs
      - run: python tools/build_release.py
      - name: Renumber the verified release and retire old assets/tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/normalize_first_release.py
