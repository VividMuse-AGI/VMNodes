name: Prepare draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_REF']=='refs/tags/v'+v, 'Run from the matching version tag'"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow
      - run: python install.py
      - run: python tools/check_release.py --public
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs
      - run: python tools/build_release.py
      - name: Create a draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
