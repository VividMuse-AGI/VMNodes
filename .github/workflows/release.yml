name: Prepare draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the version tag and every release file
        id: release
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = 'v' + version
          subprocess.run(['git', 'rev-parse', '--verify', tag + '^{commit}'], check=True)
          for name in json.load(open('release_files.json', encoding='utf-8')):
              tagged = subprocess.check_output(['git', 'show', tag + ':' + name])
              assert tagged == pathlib.Path(name).read_bytes(), 'Release differs from tag: ' + name
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('tag=' + tag + '\n')
          PY
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow
      - run: python install.py
      - run: python tools/check_release.py --public
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs
      - run: python tools/build_release.py
      - name: Create a draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/VMNodes-${RELEASE_TAG#v}.zip" \
            "dist/VMNodes-${RELEASE_TAG#v}.zip.sha256" \
            --verify-tag --draft --prerelease \
            --title "VMNodes $RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md"
